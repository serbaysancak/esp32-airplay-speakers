# Harman Kardom continuous integration.
#
# This is the pull-request gate from docs/03-firmware/firmware-plan.md stage F0.
# It proves the repository is internally consistent and that the firmware builds
# and its logic behaves. It proves nothing about hardware: every physical gate
# (G0-G8) needs recorded operator measurements and cannot run here.

name: firmware-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Pinned deliberately. A floating toolchain would make a build that passed
  # yesterday fail today for reasons unrelated to the change under review.
  IDF_VERSION: v5.5.1

jobs:
  documentation:
    name: documentation integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: check_docs
        run: python3 scripts/check_docs.py
      - name: no private key material anywhere in the tree
        # Content-based, not name-based. The .gitignore names the files a key
        # is likely to be called; this catches one called anything at all.
        # The repository is public and its history cannot be taken back.
        run: python3 scripts/check_no_private_keys.py

  host-tests:
    name: host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: configure
        run: cmake -S firmware/test -B build/host-tests -DCMAKE_BUILD_TYPE=Debug
      - name: build
        run: cmake --build build/host-tests
      - name: test
        run: ctest --test-dir build/host-tests --output-on-failure
      # This job deliberately runs WITHOUT ESP-IDF, which proves the pure
      # modules stay compilable on a machine that has never seen it. The
      # consequence is that cJSON is absent, so the manifest parser and the
      # end-to-end harness are skipped here and run in the firmware-build job
      # instead. Assert the skip is the only thing missing, so a day when the
      # whole suite silently stops running does not look like this one.
      - name: the pure suite must not depend on ESP-IDF
        run: |
          if [ -x build/host-tests/manifest_e2e ]; then
            echo "manifest_e2e built without ESP-IDF; the cJSON guard is wrong"
            exit 1
          fi
          echo "as expected: parser tests deferred to the ESP-IDF job"

  partition-layout:
    name: partition layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: check partition table
        run: python3 firmware/tools/check_partitions.py
      - name: check the devkit partition table
        # The N8R2 bring-up board has its own 8 MB table. Checking it against the
        # default 16 MB would accept a table that runs off the end of the part,
        # which is the one mistake this file cannot afford to make twice.
        run: |
          python3 firmware/tools/check_partitions.py \
            --csv firmware/partitions-devkit.csv --flash-size 8MB
      - name: test the partition validator itself
        run: python3 firmware/tools/test_check_partitions.py
      - name: test the USB recovery script
        # It exists to keep one mistake hard: a recovery flash must never reach
        # factory_cal, because nothing in software can produce those
        # measurements again.
        run: python3 firmware/tools/test_recover.py
      - name: test the release manifest generator
        # Includes the cross-check that the generator and hk_ota_client.c agree
        # on every field name. A mismatch there is silent everywhere else and
        # would make every device refuse every update.
        run: python3 firmware/tools/test_make_manifest.py
      - name: a user reset must not reach the calibration store (PRD-008)
        run: python3 firmware/tools/check_storage_isolation.py
      - name: no log statement may print a credential
        run: python3 firmware/tools/check_no_credential_logs.py

  drawings:
    name: generated drawings are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # The documentation sheet is generated. If the generator changed but the
      # committed SVG did not, the drawing in the vault is stale.
      - name: regenerate schematic
        run: python3 hardware/diagrams/generate_schematic_svg.py
      - name: fail if the committed sheet is out of date
        run: |
          if ! git diff --quiet -- docs/02-hardware/assets/harman-kardom-schematic.svg; then
            echo "The committed schematic does not match its generator."
            echo "Run: python3 hardware/diagrams/generate_schematic_svg.py"
            git --no-pager diff --stat -- docs/02-hardware/assets/harman-kardom-schematic.svg
            exit 1
          fi
      # The KiCad sheet cannot be regenerated here — it needs KiCad's symbol
      # libraries, which are not on the runner. What CAN be checked is whether
      # the committed sheet still matches the generator that produced it,
      # because the generator is editable on machines that cannot regenerate
      # the output. A schematic nobody can tell is stale is one someone will
      # solder from.
      - name: the generated KiCad sheet must match its generator
        run: python3 scripts/check_generated_kicad.py

  firmware-build:
    name: firmware build and size gate
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@v4
      - name: build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py -C firmware build
      - name: partition layout and size gate
        shell: bash
        run: |
          python3 firmware/tools/check_partitions.py \
            --app-size firmware/build/harman-kardom.bin
      # The bring-up devkit is a second real target, and the four settings that
      # define a board (flash size, PSRAM mode, partition table, OTA hardware
      # revision) are held together by configure-time guards in
      # firmware/CMakeLists.txt. Those guards are only exercised by configuring
      # the devkit profile, so a change that breaks them is invisible until
      # someone at a bench cannot build. It is also the tighter size gate: the
      # devkit slot is 0x2e0000 against the product's 0x6e0000.
      - name: build the bring-up devkit profile
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py -C firmware -B firmware/build-devkit \
            -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.devkit" \
            -D SDKCONFIG="$PWD/firmware/build-devkit/sdkconfig" \
            build
          grep -qx 'CONFIG_HK_BOARD_DEVKIT_N8R2=y' firmware/build-devkit/sdkconfig \
            || { echo "the devkit profile did not select the devkit board"; exit 1; }
          python3 firmware/tools/check_partitions.py \
            --csv firmware/partitions-devkit.csv --flash-size 8MB \
            --app-size firmware/build-devkit/harman-kardom.bin
      # The host suite again, this time with ESP-IDF present so cJSON exists
      # and the manifest parser plus the generator/validator bridge actually
      # run. Without this the parser would be tested nowhere.
      - name: host tests including the manifest parser
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cmake -S firmware/test -B build/host-idf -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/host-idf
          test -x build/host-idf/manifest_e2e || {
            echo "manifest_e2e was not built: cJSON was not found"; exit 1; }
          ./build/host-idf/hk_host_tests
      - name: generator and validator must agree on values, not just names
        shell: bash
        env:
          HK_MANIFEST_E2E: ${{ github.workspace }}/build/host-idf/manifest_e2e
        run: |
          # No cmake call here: in the espressif/idf container cmake only
          # reaches PATH after export.sh, and this step does not source it.
          # The previous step already built every target in build/host-idf,
          # manifest_e2e among them, and asserted it exists.
          # The end-to-end class skips itself when the harness is absent, which
          # reads as a green run. This is the only job that runs it, so a skip
          # here means it ran nowhere.
          python3 firmware/tools/test_make_manifest.py -v 2>&1 | tee /tmp/e2e.log
          if grep -q "skipped" /tmp/e2e.log; then
            echo "the end-to-end tests were skipped; the harness was not found"
            exit 1
          fi
          grep -q "TestEndToEnd" /tmp/e2e.log || {
            echo "no end-to-end tests ran at all"; exit 1; }
      # The calibration wall (PRD-008) was only ever argued structurally: a
      # separate partition, a read-only open, and a source scanner. This runs
      # it — real NVS, the real partition table generated from partitions.csv,
      # and the real hk_storage.c — on ESP-IDF's linux target, with no board.
      - name: the calibration wall, executed on real NVS
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py -C firmware/test/nvs_host --preview set-target linux
          idf.py -C firmware/test/nvs_host build
          cd firmware/test/nvs_host/build
          ./hk_nvs_host.elf
      - name: image size summary
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py -C firmware size
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-ci-build
          # Unsigned and not a release. Release artefacts are produced only by
          # the tag pipeline described in docs/03-firmware/ota-and-release-plan.md.
          path: |
            firmware/build/harman-kardom.bin
            firmware/build/harman-kardom.elf
            firmware/build/partition_table/partition-table.bin
          retention-days: 14
