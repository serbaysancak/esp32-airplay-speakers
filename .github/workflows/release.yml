# Harman Kardom release pipeline.
#
# Publishes a signed firmware image and the manifest that describes it, from a
# SemVer tag. ADR-0008 is the decision; docs/03-firmware/ota-and-release-plan.md
# is the detail.
#
# The pipeline is split in two on purpose. The build job compiles the release
# profile and never has access to the signing key: with
# CONFIG_SECURE_BOOT_BUILD_SIGNED_BINARIES=n the build succeeds unsigned and
# ESP-IDF itself prints "App built but not signed. Sign app before flashing".
# The key is read only by the publish job, through an environment secret.
#
# The `release` environment exists and holds HK_SIGNING_KEY as an ENVIRONMENT
# secret, so only a job declaring `environment: release` can read it. The build
# job cannot, which is the property this split exists to create. Verified
# 2026-08-31: the repository has zero repository-level secrets.
#
# The environment also carries a required-reviewer rule, so a tag push waits
# for a human. That was impossible while the repository was private — the API
# refuses protection rules with HTTP 422 there — and became free again when it
# went back to public.
#
# Do NOT work around any of this by storing HK_SIGNING_KEY as a repository
# secret. That would hand the key to every job in the repository — deleting the
# exact property the split exists to create.
#
# What this pipeline CANNOT prove: that the image runs. Every physical gate
# needs a device and an operator. A green run here means the image is
# well-formed, signed and described correctly, nothing more. The canary rollout
# in ADR-0008 exists because of exactly that gap.

name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, e.g. v0.2.0'
        required: true

permissions:
  contents: read

env:
  IDF_VERSION: v5.5.1

jobs:
  verify:
    name: verify before publishing anything
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Pinned to the tag. A workflow_dispatch run defaults its ref to the
          # default branch, so without this the pipeline would verify, build
          # and publish whatever main happens to contain while naming the
          # release after a tag that points somewhere else.
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: documentation integrity
        run: python3 scripts/check_docs.py
      - name: no private key material anywhere in the tree
        run: python3 scripts/check_no_private_keys.py
      - name: host unit tests
        run: |
          cmake -S firmware/test -B build/host-tests -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/host-tests
          ctest --test-dir build/host-tests --output-on-failure
      - name: tooling tests
        run: |
          python3 firmware/tools/test_check_partitions.py
          python3 firmware/tools/test_make_manifest.py
      - name: repository invariants
        run: |
          python3 firmware/tools/check_partitions.py
          python3 firmware/tools/check_storage_isolation.py
          python3 firmware/tools/check_no_credential_logs.py

  build:
    name: build the release profile (no key here)
    needs: verify
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: build with sdkconfig.release
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py -C firmware -B firmware/build-release \
            -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.release" \
            -D SDKCONFIG=build-release/sdkconfig \
            build
      - name: the release profile must actually require a signature
        shell: bash
        run: |
          # Kconfig writes a disabled option as "# CONFIG_X is not set", never
          # as "=n", so every assertion here is about the presence or absence
          # of "=y". Testing for "=n" would fail on a correct build.
          SDKCONFIG=firmware/build-release/sdkconfig

          # If this ever turns off silently, the pipeline would publish an
          # image that accepts unsigned updates, and nothing else would notice.
          grep -qx 'CONFIG_SECURE_SIGNED_APPS_NO_SECURE_BOOT=y' "$SDKCONFIG" \
            || { echo "release build does not require signed images"; exit 1; }

          # The build must NOT sign: the key belongs to the publish job alone.
          ! grep -qx 'CONFIG_SECURE_BOOT_BUILD_SIGNED_BINARIES=y' "$SDKCONFIG" \
            || { echo "the build job would need the signing key"; exit 1; }

          # Anti-rollback burns eFuses irreversibly. It stays off (ADR-0008).
          ! grep -qx 'CONFIG_BOOTLOADER_APP_ANTI_ROLLBACK=y' "$SDKCONFIG" \
            || { echo "anti-rollback would burn eFuses on every boot"; exit 1; }

          # A release is for the product board. The devkit profile builds for
          # 8 MB of flash with a different partition table and reports a
          # different OTA hardware revision; published under a product tag it
          # would be an image no product board accepts and every devkit does.
          ! grep -qx 'CONFIG_HK_BOARD_DEVKIT_N8R2=y' "$SDKCONFIG" \
            || { echo "the release build is configured for the bring-up devkit"; exit 1; }
          grep -qx 'CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y' "$SDKCONFIG" \
            || { echo "the release build is not configured for a 16 MB part"; exit 1; }
      - name: rollback and its health check must be enabled together
        shell: bash
        run: |
          # Enabling rollback without the call that confirms a good boot means
          # every published image reverts on first restart, so updates never
          # take. Enabling the call without rollback means a bad image stays.
          # Neither failure is visible until a device is in someone's room, so
          # the two are tied together here rather than in a comment.
          if grep -qx 'CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=y' \
               firmware/build-release/sdkconfig; then
            # Match a CALL, not the name. The old grep also matched the two
            # places hk_health.h mentions the function in prose, so the guard
            # would have passed while nothing called it.
            if ! grep -rqE 'esp_ota_mark_app_valid_cancel_rollback[[:space:]]*\(' \
                   --include='*.c' firmware/main firmware/components; then
              echo "Rollback is enabled but nothing calls"
              echo "esp_ota_mark_app_valid_cancel_rollback(). Every update"
              echo "would revert on the first restart."
              exit 1
            fi
          fi
      - name: size gate
        shell: bash
        run: |
          python3 firmware/tools/check_partitions.py \
            --app-size firmware/build-release/harman-kardom.bin
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-release-build
          path: |
            firmware/build-release/harman-kardom.bin
            firmware/build-release/harman-kardom.elf
            firmware/build-release/bootloader/bootloader.bin
            firmware/build-release/partition_table/partition-table.bin
          retention-days: 90

  publish:
    name: sign and publish
    needs: build
    runs-on: ubuntu-latest
    # The only job that can read HK_SIGNING_KEY. Protect this environment with
    # required reviewers: approving a release and approving key use are then
    # the same action.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-release-build
          path: artifacts
      - name: resolve the tag
        id: tag
        env:
          # Through the environment rather than interpolated into the script.
          # workflow_dispatch's `tag` is free text, and a value containing a
          # quote or a backtick would otherwise be pasted straight into a
          # shell line by the expression expander.
          RAW_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          case "$RAW_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "refusing to publish '$RAW_TAG': not a vMAJOR.MINOR.PATCH tag"
               exit 1 ;;
          esac
          echo "value=$RAW_TAG" >> "$GITHUB_OUTPUT"

      - name: install esptool
        run: pip install --disable-pip-version-check 'esptool==4.12.0'

      - name: sign the image
        env:
          HK_SIGNING_KEY: ${{ secrets.HK_SIGNING_KEY }}
        run: |
          if [ -z "$HK_SIGNING_KEY" ]; then
            echo "HK_SIGNING_KEY is not set in the 'release' environment."
            echo "Generate it OFFLINE, once, and never in CI:"
            echo "  idf.py secure-generate-signing-key --version 2 --scheme rsa3072 hk_signing_key.pem"
            echo "RSA-3072 is the only scheme ESP32-S3 supports."
            exit 1
          fi
          umask 077
          printf '%s' "$HK_SIGNING_KEY" > signing_key.pem
          espsecure.py extract_public_key --version 2 \
            --keyfile signing_key.pem signing_key.pub.bin

          # A key that has ever been exposed can be used by whoever saw it to
          # sign firmware these speakers would accept. Exposure is not undone
          # by making a repository private afterwards, so the list is permanent
          # and is checked before anything is signed.
          FINGERPRINT=$(sha256sum signing_key.pub.bin | cut -d' ' -f1)
          while IFS= read -r line; do
            case "$line" in ''|'#'*) continue ;; esac
            if [ "$line" = "$FINGERPRINT" ]; then
              echo "HK_SIGNING_KEY matches a fingerprint in"
              echo "docs/credentials/burned-keys.txt. That key was exposed and"
              echo "must never sign a release. Generate a new one offline and"
              echo "store it as the release environment secret."
              exit 1
            fi
          done < docs/credentials/burned-keys.txt

          # Verifying the signature against the key that just made it proves
          # nothing — any valid RSA-3072 key passes. What matters is whether
          # this is the key the DEVICES already trust, because the trust anchor
          # is the running app's own signature block. Signing with the wrong
          # valid key produces a release all four speakers silently refuse,
          # recoverable only by USB reflashing every unit.
          PINNED=firmware/certs/hk-signing-key.pub.bin
          if [ ! -f "$PINNED" ]; then
            echo "No pinned public key at $PINNED, so there is no way to tell"
            echo "whether HK_SIGNING_KEY is the key the devices trust."
            echo "Pin it once, from the real signing key:"
            echo "  espsecure.py extract_public_key --version 2 \\"
            echo "    --keyfile hk_signing_key.pem $PINNED"
            exit 1
          fi
          cmp -s signing_key.pub.bin "$PINNED" || {
            echo "HK_SIGNING_KEY does not match the pinned public key in"
            echo "$PINNED. Publishing this would ship a release every device"
            echo "refuses. Refusing."
            exit 1
          }

          espsecure.py sign_data --version 2 --keyfile signing_key.pem \
            --output harman-kardom-signed.bin \
            artifacts/harman-kardom.bin

      - name: wipe the key
        # Its own step, and always: a failed sign or a failed comparison above
        # must not leave the key sitting in the workspace.
        if: always()
        run: |
          shred -u signing_key.pem 2>/dev/null || rm -f signing_key.pem
          rm -f signing_key.pub.bin committed.pub.bin

      - name: describe what was signed
        run: |
          # The manifest is generated FROM the signed image, because that is the
          # file devices download and hash. Signing pads the image and appends a
          # signature sector, so a manifest built from the unsigned binary would
          # carry the wrong size and digest and every device would refuse it.
          python3 firmware/tools/make_manifest.py \
            --image harman-kardom-signed.bin \
            --tag "${{ steps.tag.outputs.value }}" \
            --asset-url "https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.value }}/harman-kardom.bin" \
            --channel canary \
            --out manifest.json
          cat manifest.json

      - name: the published image must satisfy the device's own checks
        run: |
          # A last read-back: the manifest has to agree with the binary beside
          # it. make_manifest generates both from the same file, so this can
          # only fail if the artefacts were swapped between steps — which is
          # precisely the case worth catching before four speakers try it.
          python3 - <<'PY'
          import hashlib, json, pathlib, sys
          manifest = json.loads(pathlib.Path("manifest.json").read_text())
          blob = pathlib.Path("harman-kardom-signed.bin").read_bytes()
          problems = []
          if manifest["sha256"] != hashlib.sha256(blob).hexdigest():
              problems.append("sha256 does not match the signed image")
          if manifest["size"] != len(blob):
              problems.append(f"size {manifest['size']} != {len(blob)}")
          if manifest["target"] != "esp32s3":
              problems.append("target is not esp32s3")
          if problems:
              sys.exit("manifest disagrees with the image: " + "; ".join(problems))
          print("manifest and signed image agree")
          PY

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp harman-kardom-signed.bin harman-kardom.bin
          # A new release is a CANDIDATE. Nothing reaches the other three
          # speakers until one of them has run it and someone promoted it —
          # that is the canary step, and defaulting the other way would make it
          # optional in practice.
          gh release create "${{ steps.tag.outputs.value }}" \
            --repo "${{ github.repository }}" \
            --title "${{ steps.tag.outputs.value }}" \
            --generate-notes \
            --verify-tag \
            --prerelease \
            harman-kardom.bin manifest.json \
            artifacts/bootloader/bootloader.bin \
            artifacts/partition_table/partition-table.bin

      - name: point the canary channel at it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Devices look at a fixed address per channel, so publishing moves
          # what a tag carries rather than where a device looks. The tag never
          # changes; a speaker's URL never changes with it.
          gh release view channel-canary --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create channel-canary \
              --repo "${{ github.repository }}" \
              --title "Canary channel pointer" \
              --notes "Carries the manifest.json that devices on the canary channel fetch. Moved by the release workflow; not a release in itself." \
              --prerelease
          gh release upload channel-canary manifest.json \
            --repo "${{ github.repository }}" --clobber
